function renderBase(){document.querySelector('#globalActions').innerHTML=actionButtons();document.querySelector('#itinerary').innerHTML='<div class="dayRail" id="dayRail">'+D.map(card).join('')+'</div><div id="dayCheckins"></div>';setupDayRail();setTimeout(loadCheckins,0);let iso=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Tokyo'}),d=D.find(x=>x[1]===iso)||D[0];document.querySelector('#today').innerHTML='<div class="note"><b>Trip focus</b><div class="small">Automatically follows Japan local time during the trip.</div></div>'+card(d);document.querySelector('#dayNav').innerHTML=D.map((x,i)=>'<button class="'+dayColors[i]+'" onclick="showDay('+x[0]+')">'+x[0]+' · '+x[2].split(', ')[1]+'</button>').join('');document.querySelector('#stays').innerHTML='<div class="note">Costs and confirmation numbers are intentionally omitted from this shared site.</div>'+stays.map(s=>'<article class="reservation"><b>'+s[1]+'</b><div class="small">'+s[0]+' · '+s[2]+'</div><br><a class="btn" target="_blank" href="'+maps(s[1])+'">Map hotel</a></article>').join('');let c=JSON.parse(localStorage.getItem('jp-pack')||'{}');document.querySelector('#packing').innerHTML='<div class="note">Packing checks stay on this device.</div><div class="day pack">'+pack.map((x,i)=>'<label><input type="checkbox" '+(c[i]?'checked':'')+' onchange="packToggle('+i+',this.checked)"> '+x+'</label>').join('')+'</div>'}
function setupDayRail(){let rail=document.querySelector('#dayRail');if(!rail)return;let cards=[...rail.children];let focus=()=>{let cx=rail.scrollLeft+rail.clientWidth/2,best=cards[0],dist=Infinity;cards.forEach(c=>{let x=c.offsetLeft+c.offsetWidth/2,d=Math.abs(x-cx);if(d<dist){dist=d;best=c}});cards.forEach(c=>c.classList.toggle('focused',c===best))};rail.addEventListener('scroll',()=>requestAnimationFrame(focus),{passive:true});setTimeout(focus,50)}function tab(id){document.querySelectorAll('section').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));scrollTo(0,0)}
function showDay(n){currentDay=n;tab('itinerary');setTimeout(loadCheckins,80);setTimeout(()=>{let rail=document.querySelector('#dayRail'),c=rail.children[n-1];rail.scrollTo({left:c.offsetLeft-(rail.clientWidth-c.offsetWidth)/2,behavior:'smooth'})},30)}
function cityForDay(n){if(n===4)return'fuji';if(n===8)return'nara';if(n===11)return'kamakura';if(n>=5&&n<=8)return'kyoto';return n===3?'fuji':n===5?'kyoto':'tokyo'}
function mealNow(){let h=Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',hour:'2-digit',hour12:false}).format(new Date()));return h<10?'breakfast':h<=14?'lunch':h<17?'cafe':'dinner'}
function diningSuggestion(){if(!session)return'';let iso=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Tokyo'}),d=D.find(x=>x[1]===iso)||D[currentDay-1],city=cityForDay(d[0]),meal=mealNow(),e=eats[city][meal];return '<div class="foodCard"><div class="mealTag">'+meal.toUpperCase()+' IDEA · DAY '+d[0]+'</div><h3>'+e[0]+'</h3><div class="small">'+e[1]+'</div><br><a class="btn" target="_blank" href="'+maps(e[0])+'">See on map</a><button class="btn light pollBtn" onclick="startFoodPoll(\''+esc(e[0]).replace(/&#39;/g,"\\'")+'\')">Poll the family</button><div id="foodPollStatus"></div></div>'}
async function startFoodPoll(place){let el=document.querySelector('#foodPollStatus');el.innerHTML='<div class="status">Poll setup is almost ready. One final database table is needed.</div>'}
function packToggle(i,v){let c=JSON.parse(localStorage.getItem('jp-pack')||'{}');c[i]=v;localStorage.setItem('jp-pack',JSON.stringify(c))}
async function authUI(){if(!session){document.querySelector('#journal').innerHTML='<div class="journalBox authCard"><h3>Family Travel Log</h3><p>Sign in by email to see family comments and photos.</p><div class="formrow"><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><button class="btn" onclick="sendLink()">Email me a sign-in link</button></div><div id="authStatus"></div></div>';return}await journalUI()}
async function sendLink(){let email=document.querySelector('#email').value.trim(),el=document.querySelector('#authStatus');if(!email)return;el.innerHTML='<div class="status">Sending…</div>';let {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});el.innerHTML='<div class="status '+(error?'error':'')+'">'+(error?error.message:'Check your email and tap the sign-in link.')+'</div>'}
async function journalUI(){let name=localStorage.getItem('jp-name')||'',d=D[currentDay-1];document.querySelector('#journal').innerHTML=diningSuggestion()+'<div class="journalBox"><div class="daynum">Day '+currentDay+' · '+d[2]+'</div><h2 style="margin:3px 0">Family Travel Log</h2><div class="formrow"><input id="displayName" placeholder="Your name" value="'+esc(name)+'"><textarea id="comment" maxlength="3000" placeholder="What happened today? Favorite moment, meal, quote from the kids…"></textarea><label class="upload">Add photos <input id="photos" type="file" accept="image/*" multiple onchange="previewFiles(this.files)"><div class="small">Up to 10 MB each. Photos are private to signed-in family.</div><div class="preview" id="preview"></div></label><button class="btn" onclick="postLog()">Add to Day '+currentDay+'</button><button class="btn light" onclick="signOut()">Sign out</button><div id="postStatus"></div></div></div><div id="posts"><div class="note">Loading family posts…</div></div>';await loadPosts();setTimeout(loadCheckins,0)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function previewFiles(files){selectedFiles=[...files];document.querySelector('#preview').innerHTML=selectedFiles.map(f=>'<img src="'+URL.createObjectURL(f)+'">').join('')}
async function postLog(){let name=document.querySelector('#displayName').value.trim(),comment=document.querySelector('#comment').value.trim(),st=document.querySelector('#postStatus');if(!name){st.innerHTML='<div class="status error">Add your name first.</div>';return}if(!comment&&!selectedFiles.length){st.innerHTML='<div class="status error">Add a comment or photo.</div>';return}st.innerHTML='<div class="status">Saving your travel log…</div>';localStorage.setItem('jp-name',name);await sb.from('profiles').upsert({id:session.user.id,display_name:name});let {data:log,error}=await sb.from('travel_log').insert({day_number:currentDay,user_id:session.user.id,comment:comment||null}).select().single();if(error){st.innerHTML='<div class="status error">'+esc(error.message)+'</div>';return}for(const file of selectedFiles){let safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=session.user.id+'/'+currentDay+'/'+Date.now()+'-'+safe;let up=await sb.storage.from('travel-photos').upload(path,file,{contentType:file.type,upsert:false});if(!up.error)await sb.from('travel_log_photos').insert({travel_log_id:log.id,user_id:session.user.id,storage_path:path})}selectedFiles=[];document.querySelector('#comment').value='';st.innerHTML='<div class="status">Added to the family log.</div>';await loadPosts()}
async function loadPosts(){let {data:logs,error}=await sb.from('travel_log').select('*').eq('day_number',currentDay).order('created_at',{ascending:true});if(error){document.querySelector('#posts').innerHTML='<div class="note error">'+esc(error.message)+'</div>';return}let {data:profiles}=await sb.from('profiles').select('id,display_name'),{data:photos}=await sb.from('travel_log_photos').select('*');let names=Object.fromEntries((profiles||[]).map(p=>[p.id,p.display_name||'Family'])),by={};for(const p of photos||[])(by[p.travel_log_id]??=[]).push(p);let out='';for(const l of logs||[]){let imgs='';for(const p of by[l.id]||[]){let {data}=await sb.storage.from('travel-photos').createSignedUrl(p.storage_path,3600);if(data?.signedUrl)imgs+='<img loading="lazy" src="'+data.signedUrl+'">'}out+='<article class="post"><div class="author">'+esc(names[l.user_id]||'Family')+'</div><div class="postMeta">'+new Date(l.created_at).toLocaleString()+'</div>'+(l.comment?'<div class="postText">'+esc(l.comment)+'</div>':'')+(imgs?'<div class="postPhotos">'+imgs+'</div>':'')+'</article>'}document.querySelector('#posts').innerHTML=out||'<div class="note">No entries yet. Someone gets to write the first page.</div>'}

const foodChoices=[['ramen','🍜','Ramen'],['sushi','🍣','Sushi'],['steak','🥩','Steakhouse'],['tempura','🍤','Tempura'],['yakitori','🍢','Yakitori'],['noodles','🍲','Udon / Soba'],['tonkatsu','🍛','Tonkatsu'],['okonomiyaki','🥞','Okonomiyaki'],['curry','🍛','Curry'],['izakaya','🏮','Izakaya'],['cafe','🍰','Cafe / Sweets'],['other','🍱','Other']];
let hungerLevel=0,hungerFoods=[],pollTimer=null;
function beginHunger(){document.body.insertAdjacentHTML('beforeend','<div class="modalShade" id="hungerModal"><div class="sheet"><div class="sheetHead"><div><div class="daynum">FAMILY FOOD POLL</div><h2>I’m Hungry</h2></div><button class="closeX" onclick="closeModal()">✕</button></div><p>How hungry are you?</p><div class="cats">'+[1,2,3,4,5].map(n=>'<button class="catChoice" id="cat'+n+'" onclick="pickHunger('+n+')"><span class="catFace">'+(n<3?'😺':n<5?'😻':'🙀')+'</span><b>'+n+'</b></button>').join('')+'</div><h3>What are you hungry for?</h3><div class="foodGrid">'+foodChoices.map(x=>'<button class="foodOpt" id="food-'+x[0]+'" onclick="toggleFood(\''+x[0]+'\')"><span class="foodEmoji">'+x[1]+'</span>'+x[2]+'</button>').join('')+'</div><button class="btn" style="width:100%;padding:13px" onclick="submitHunger()">Start 5-minute poll</button><div id="hungerStatus"></div></div></div>')}
function closeModal(){document.querySelector('#hungerModal')?.remove();if(pollTimer)clearInterval(pollTimer)}
function pickHunger(n){hungerLevel=n;document.querySelectorAll('.catChoice').forEach((e,i)=>e.classList.toggle('on',i===n-1))}
function toggleFood(k){let i=hungerFoods.indexOf(k);i<0?hungerFoods.push(k):hungerFoods.splice(i,1);document.querySelector('#food-'+k).classList.toggle('on',hungerFoods.includes(k))}
async function submitHunger(){let st=document.querySelector('#hungerStatus');if(!hungerLevel||!hungerFoods.length){st.innerHTML='<div class="status error">Pick a hunger level and at least one food.</div>';return}let city=cityForDay(currentDay),{data:p,error}=await sb.from('hunger_polls').insert({created_by:session.user.id,day_number:currentDay,location_name:city}).select().single();if(error){st.innerHTML='<div class="status error">'+esc(error.message)+'</div>';return}let r=await sb.from('hunger_responses').insert({poll_id:p.id,user_id:session.user.id,appetite_status:'could_eat',hunger_level:hungerLevel,food_preferences:hungerFoods});if(r.error){st.innerHTML='<div class="status error">'+esc(r.error.message)+'</div>';return}showWaiting(p)}
function showWaiting(p){let end=new Date(p.expires_at).getTime();document.querySelector('#hungerModal .sheet').innerHTML='<div class="sheetHead"><div><div class="daynum">POLL IS LIVE</div><h2>Finding food…</h2></div><button class="closeX" onclick="closeModal()">✕</button></div><div class="waitBox"><div class="waitCat">😺🍜</div><div><b>Nom nom nom…</b></div><div class="small">Waiting for everyone to respond</div><div class="countdown" id="countdown">5:00</div></div><div id="responseCount" class="status">Your answer is in.</div>';let tick=()=>{let left=Math.max(0,end-Date.now()),m=Math.floor(left/60000),sec=Math.floor(left%60000/1000);let el=document.querySelector('#countdown');if(el)el.textContent=m+':'+String(sec).padStart(2,'0');if(!left){clearInterval(pollTimer);if(el)el.textContent='Poll closed'}};tick();pollTimer=setInterval(tick,1000)}
let pendingLocation=null;
function beginCheckin(){pendingLocation=null;document.body.insertAdjacentHTML('beforeend','<div class="modalShade" id="hungerModal"><div class="sheet"><div class="sheetHead"><div><h2>Check In</h2><div class="small">Share where you are and what you’re doing!</div></div><button class="closeX" onclick="closeModal()">✕</button></div><h3><span class="stepDot">1</span> Your location</h3><div id="checkinMap" class="checkMap"></div><button class="btn light" style="width:100%" onclick="getCheckinLocation()">◎ Use current location</button><div id="locationState" class="status">Location not selected</div><h3><span class="stepDot">2</span> What are you doing?</h3><textarea id="checkActivity" maxlength="200" placeholder="Grabbing coffee at a local cafe before heading to Meiji Shrine ☕"></textarea><div class="privacyNote">Your location is shared only when you tap Share Check In. This is not continuous tracking.</div><br><button class="btn" style="width:100%;padding:14px" onclick="shareCheckin()">📍 Share Check In</button><div id="checkStatus"></div></div></div>');setTimeout(initCheckinMap,50)}
let checkinMap=null,checkinMarker=null;function initCheckinMap(){let el=document.querySelector('#checkinMap');if(!el||!window.L)return;checkinMap=L.map(el,{zoomControl:false}).setView([35.6895,139.6917],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(checkinMap)}
function getCheckinLocation(){let st=document.querySelector('#locationState');st.textContent='Requesting location…';if(!navigator.geolocation){st.textContent='Location is not supported by this browser.';return}navigator.geolocation.getCurrentPosition(p=>{pendingLocation={lat:p.coords.latitude,lng:p.coords.longitude};st.innerHTML='<b>Location ready</b><br><span class="small">Accuracy about '+Math.round(p.coords.accuracy)+' m</span>';if(checkinMap){checkinMap.setView([pendingLocation.lat,pendingLocation.lng],16);if(checkinMarker)checkinMarker.remove();checkinMarker=L.marker([pendingLocation.lat,pendingLocation.lng]).addTo(checkinMap)}},e=>{st.textContent=e.code===1?'Location permission was not granted.':'Could not get your location. Try again.'},{enableHighAccuracy:true,timeout:12000,maximumAge:60000})}
async function shareCheckin(){let st=document.querySelector('#checkStatus'),activity=document.querySelector('#checkActivity').value.trim();if(!pendingLocation){st.innerHTML='<div class="status error">Tap Use current location first.</div>';return}st.innerHTML='<div class="status">Sharing check-in…</div>';let {error}=await sb.from('traveler_checkins').insert({user_id:session.user.id,day_number:currentDay,latitude:pendingLocation.lat,longitude:pendingLocation.lng,activity:activity||null});if(error){st.innerHTML='<div class="status error">'+esc(error.message)+'</div>';return}let name=localStorage.getItem('jp-name')||'Family';await sb.from('profiles').upsert({id:session.user.id,display_name:name});await sb.from('travel_log').insert({day_number:currentDay,user_id:session.user.id,comment:'📍 Checked in'+(activity?' · '+activity:'')});closeModal();await journalUI();await loadCheckins()}
function timeAgo(t){let m=Math.max(0,Math.floor((Date.now()-new Date(t))/60000));return m<1?'just now':m<60?m+' min ago':m<1440?Math.floor(m/60)+' hr ago':Math.floor(m/1440)+' day ago'}
async function loadCheckins(){if(!session)return;let {data:rows}=await sb.from('traveler_checkins').select('*').eq('day_number',currentDay).order('checked_in_at',{ascending:false}),{data:profiles}=await sb.from('profiles').select('id,display_name');if(!rows)return;let names=Object.fromEntries((profiles||[]).map(p=>[p.id,p.display_name||'Family'])),latest={};rows.forEach(r=>{if(!latest[r.user_id])latest[r.user_id]=r});let people=Object.values(latest),host=document.querySelector('#dayCheckins');if(!host)return;if(!people.length){host.innerHTML='<div class="checkRegion"><h3>Where Everyone Is</h3><div class="note">No one has checked in yet today.</div></div>';return}host.innerHTML='<div class="checkRegion"><h3>Where Everyone Is</h3><div id="familyMap" class="miniMap"></div><div id="mapLegend" class="mapLegend"></div><div class="small" style="margin-top:6px">Interactive OpenStreetMap. Tap a pin for the traveler, activity and last check-in time. The location is their last manual check-in, not live tracking.</div></div>';setTimeout(()=>renderFamilyMap(people,names),0)}
let familyMap=null;
function renderFamilyMap(people,names){let el=document.querySelector('#familyMap');if(!el||!window.L)return;if(familyMap){familyMap.remove();familyMap=null}familyMap=L.map(el,{zoomControl:true,attributionControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(familyMap);let bounds=[];people.forEach((p,i)=>{let name=names[p.user_id]||'Family',initial=esc(name).charAt(0).toUpperCase(),icon=L.divIcon({className:'familyMarker',html:'<div class="familyPin"><span>'+initial+'</span></div>',iconSize:[38,38],iconAnchor:[19,38],popupAnchor:[0,-36]});let marker=L.marker([p.latitude,p.longitude],{icon}).addTo(familyMap);marker.bindPopup('<b>'+esc(name)+'</b><br>'+esc(p.activity||'Checked in')+'<br><span class="small">'+timeAgo(p.checked_in_at)+'</span><br><a target="_blank" href="https://www.google.com/maps?q='+p.latitude+','+p.longitude+'">Open in Google Maps</a>');bounds.push([p.latitude,p.longitude])});if(bounds.length===1)familyMap.setView(bounds[0],15);else familyMap.fitBounds(bounds,{padding:[45,45],maxZoom:15});let legend=document.querySelector('#mapLegend');if(legend)legend.innerHTML=people.map((p,i)=>'<button onclick="familyMap.setView(['+p.latitude+','+p.longitude+'],16)"><b>📍 '+esc(names[p.user_id]||'Family')+'</b> · '+timeAgo(p.checked_in_at)+'</button>').join('');setTimeout(()=>familyMap.invalidateSize(),80)}
async function openJournal(n){currentDay=n;tab('journal');await authUI()}
async function signOut(){await sb.auth.signOut();session=null;await authUI()}
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=async()=>{tab(b.dataset.tab);if(b.dataset.tab==='journal')await authUI()});renderBase();sb.auth.getSession().then(async({data})=>{session=data.session;await authUI();if(session){loadCheckins();sb.channel('family-checkins').on('postgres_changes',{event:'INSERT',schema:'public',table:'traveler_checkins'},()=>loadCheckins()).subscribe()}});sb.auth.onAuthStateChange(async(_,s)=>{session=s;if(document.querySelector('#journal').classList.contains('active'))setTimeout(authUI,0)});
</script></body></html><style>@media(min-width:850px){.hero{display:grid;grid-template-columns:42% 58%;min-height:230px}.hero img{height:100%;min-height:230px}.heroText{display:flex;flex-direction:column;justify-content:center;padding:30px 38px}.hero h1{font-size:42px}.nav{padding:9px 4px 15px}.nav button{padding:9px 14px}.reservation{padding:20px}.foodCard,.journalBox,.post,.note{padding:18px}.dayPhoto{height:250px}.bottom button{font-size:13px;padding:10px}}</style>
