async function postLog(){let name=document.querySelector('#displayName').value.trim(),comment=document.querySelector('#comment').value.trim(),st=document.querySelector('#postStatus');if(!name){st.innerHTML='<div class="status error">Add your name first.</div>';return}if(!comment&&!selectedFiles.length){st.innerHTML='<div class="status error">Add a comment or photo.</div>';return}st.innerHTML='<div class="status">Saving your travel log…</div>';localStorage.setItem('jp-name',name);await sb.from('profiles').upsert({id:session.user.id,display_name:name});let {data:log,error}=await sb.from('travel_log').insert({day_number:currentDay,user_id:session.user.id,comment:comment||null}).select().single();if(error){st.innerHTML='<div class="status error">'+esc(error.message)+'</div>';return}for(const file of selectedFiles){let safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=session.user.id+'/'+currentDay+'/'+Date.now()+'-'+safe;let up=await sb.storage.from('travel-photos').upload(path,file,{contentType:file.type,upsert:false});if(!up.error)await sb.from('travel_log_photos').insert({travel_log_id:log.id,user_id:session.user.id,storage_path:path})}selectedFiles=[];document.querySelector('#comment').value='';st.innerHTML='<div class="status">Added to the family log.</div>';await loadPosts()}
