<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16231c"><title>Japan 2026 Family Trip</title>
<style>:root{--ink:#172019;--muted:#68736b;--paper:#f5f3ed;--card:#fff;--accent:#b54736;--green:#264f3c;--line:#deddd6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Trebuchet MS",Arial,sans-serif;line-height:1.4}.wrap{max-width:720px;margin:auto;padding:18px 16px 92px}.hero{background:#264f3c;color:white;border-radius:24px;padding:24px 20px;margin-bottom:14px}.hero h1{font-size:32px;margin:5px 0}.hero p{margin:0;opacity:.85}.nav{display:flex;gap:8px;overflow:auto;padding:8px 0 12px}.nav button{white-space:nowrap;background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:999px}.day,.reservation,.packgroup,.note{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.daynum{font-size:12px;color:var(--accent);font-weight:bold}.day h2{font-size:21px;margin:2px 0}.hotel,.small{font-size:13px;color:var(--muted)}.timeline{padding-left:22px}.flag{margin-top:10px;background:#fff6df;border-radius:10px;padding:9px 10px;font-size:13px}.btn{display:inline-block;text-decoration:none;background:var(--green);color:#fff;padding:9px 11px;border-radius:10px;font-size:13px}.check{display:flex;gap:10px;padding:10px 0;border-top:1px solid #eee}.check input{width:20px;height:20px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px;display:flex;justify-content:center}.bottom div{width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.bottom button{background:transparent;border:0;padding:8px}section{display:none}section.active{display:block}</style></head>
<body><main class="wrap"><div class="hero"><div>FAMILY TRIP · JAPAN</div><h1>Japan 2026</h1><p>September 27 - October 10 · Tokyo · Fuji Five Lakes · Kyoto · Nara · Kamakura</p></div><div class="nav" id="dayNav"></div><section id="today" class="active"></section><section id="itinerary"></section><section id="reservations"></section><section id="packing"></section></main><nav class="bottom"><div><button data-tab="today">Today</button><button data-tab="itinerary">Days</button><button data-tab="reservations">Stays</button><button data-tab="packing">Packing</button></div></nav>
<script>
const days=[
[1,'2026-09-27','Sun, Sep 27','Hotel Groove','Tokyo · Shinjuku',['Family 1 arrives at Haneda Airport at 20:35','Private transfer: driver pickup to hotel'],''],
[2,'2026-09-28','Mon, Sep 28','Hotel Groove','Tokyo',['Meiji Shrine and peaceful walk','Harajuku + Omotesando','Lunch: Gyukatsu Motomura or Afuri Ramen','Family 2 arrives at 20:15'],'Forward all luggage from Tokyo to Kyoto'],
[3,'2026-09-29','Tue, Sep 29','Rakuten STAY VILLA','Tokyo to Kawaguchiko',['Van to Kawaguchiko','Stop at 1-2 viewpoints','Shop for food, then hotel check-in','Go to the lake'],'Cash needed for van + guide'],
[4,'2026-09-30','Wed, Sep 30','Rakuten STAY VILLA','Kawaguchiko',['Oshino Hakkai · arrive 08:30 or earlier','Mt. Fuji hike drop-off for hikers','Rest of group: outlet shopping','Meet again for dinner'],''],
[5,'2026-10-01','Thu, Oct 1','KOKO Castle','Kawaguchiko to Kyoto',['Breakfast + check-out','Van departs around 10:30-11:00','About 5 hour drive to Kyoto','Hotel drop-off'],'Cash needed for driver'],
[6,'2026-10-02','Fri, Oct 2','KOKO Castle','Kyoto · Arashiyama',['Arashiyama Bamboo Grove · before 08:30','Tenryu-ji','Okochi Sanso Garden','Lunch + riverside','Togetsukyo Bridge','Iwatayama Monkey Park · optional','Evening: Nishiki Market + Shinkyogoku + Teramachi'],''],
[7,'2026-10-03','Sat, Oct 3','KOKO Castle','Kyoto',['Kurama to Kibune forest walk','Kifune Shrine in the evening'],''],
[8,'2026-10-04','Sun, Oct 4','KOKO Castle','Kyoto to Nara',['Nara Park + deer','Todai-ji Temple · Great Buddha','Kasuga Taisha Shrine','Nakatanidou mochi','Return to Kyoto in afternoon'],'Forward all luggage from Kyoto to Tokyo'],
[9,'2026-10-05','Mon, Oct 5','Hyatt Regency Tokyo','Kyoto to Tokyo',['Shinkansen to Tokyo around midday','Arrive Tokyo in afternoon','Check in, shop, and eat'],'Confirm reserved Shinkansen tickets and local transfer'],
[10,'2026-10-06','Tue, Oct 6','Hyatt Regency Tokyo','Tokyo · Shibuya',['Shibuya','Pokemon Center','Shopping','Shibuya Sky','Miyashita Park','Nintendo Tokyo','Mega Don Quijote'],'Shibuya Sky: book in advance'],
[11,'2026-10-07','Wed, Oct 7','Kimpton Shinjuku Tokyo','Tokyo to Kamakura',['Kamakura day trip','Great Buddha + temples'],''],
[12,'2026-10-08','Thu, Oct 8','Kimpton Shinjuku Tokyo','Tokyo',['Shopping + walking','Morning: Ginza','Afternoon: Tokyo Station','Evening: Marunouchi'],'Ghibli Museum depends on ticket time'],
[13,'2026-10-09','Fri, Oct 9','Kimpton Shinjuku Tokyo','Tokyo',['Family 2 departs · flight 10:20 + morning transfer','Family 1: relax / family day'],'No tour needed'],
[14,'2026-10-10','Sat, Oct 10','Kimpton Shinjuku Tokyo','Tokyo to Home',['Family 1 early departure · flight 08:30','Private transfer to airport'],'']];
const stays=[['Sep 27-29','HOTEL GROOVE SHINJUKU, A PARKROYAL Hotel','Tokyo · 2 nights'],['Sep 29-Oct 1','Rakuten STAY VILLA FujiKawaguchiko Forest','Kawaguchiko · 2 nights'],['Oct 1-5','KOKO Castle','Kyoto · 4 nights'],['Oct 5-7','Hyatt Regency Tokyo','Tokyo · 2 nights'],['Oct 7-10','Kimpton Shinjuku Tokyo','Tokyo · 3 nights']];
const pack=['Passports for everyone','Travel insurance details','Credit cards and yen','Hotel + flight confirmations','Phones + charging cables','Power banks · carry-on only','AirTags / luggage trackers','Emily’s travel iPhone','Headphones','Walking shoes','Rain jackets / compact umbrellas','Layers for Fuji Five Lakes','Kids daypacks','Plane snacks','Prescription medicines','Bandages / blister care','Sunscreen'];
function maps(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q+' Japan')}
function card(d){return '<article class="day"><div class="daynum">Day '+d[0]+'</div><h2>'+d[2]+'</h2><div class="hotel">'+d[3]+' · '+d[4]+'</div><ul class="timeline">'+d[5].map(x=>'<li>'+x+'</li>').join('')+'</ul><a class="btn" target="_blank" href="'+maps(d[4])+'">Open map</a>'+(d[6]?'<div class="flag">'+d[6]+'</div>':'')+'</article>'}
function render(){document.querySelector('#itinerary').innerHTML=days.map(card).join('');let iso=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Tokyo'}),d=days.find(x=>x[1]===iso)||days[0];document.querySelector('#today').innerHTML='<div class="note"><b>Trip focus</b><div class="small">Japan local date view</div></div>'+card(d);document.querySelector('#dayNav').innerHTML=days.map(x=>'<button onclick="showDay('+x[0]+')">'+x[0]+' · '+x[2].split(', ')[1]+'</button>').join('');document.querySelector('#reservations').innerHTML='<div class="note">Hotel costs and confirmation numbers are intentionally not displayed on this shared family site.</div>'+stays.map(s=>'<article class="reservation"><h3>'+s[1]+'</h3><div class="small">'+s[0]+' · '+s[2]+'</div><br><a class="btn" target="_blank" href="'+maps(s[1])+'">Map hotel</a></article>').join('');renderPack()}
function renderPack(){let c=JSON.parse(localStorage.getItem('jp-pack')||'{}');document.querySelector('#packing').innerHTML='<div class="note">Checks are saved separately on each phone.</div><article class="packgroup"><h3>Packing list</h3>'+pack.map((x,i)=>'<label class="check"><input type="checkbox" '+(c[i]?'checked':'')+' onchange="toggle('+i+',this.checked)"><span>'+x+'</span></label>').join('')+'</article>'}
function toggle(i,v){let c=JSON.parse(localStorage.getItem('jp-pack')||'{}');c[i]=v;localStorage.setItem('jp-pack',JSON.stringify(c))}
function tab(id){document.querySelectorAll('section').forEach(x=>x.classList.toggle('active',x.id===id));window.scrollTo(0,0)}
function showDay(n){tab('itinerary');setTimeout(()=>document.querySelectorAll('#itinerary .day')[n-1].scrollIntoView(),20)}
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));render();
</script></body></html>
